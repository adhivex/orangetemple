# Dependency install scripts: pnpm runs only those listed as true. Keep this minimal
# and give a reason for each entry.
allowBuilds:
  # Native resolver used by eslint-import-resolver-typescript (via eslint-config-next).
  unrs-resolver: true
  # Verifies and links esbuild's native binary, used by tsx to run the seed script.
  esbuild: true
  '@swc/core': set this to true or false
