name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_TARGET: development

    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Pages prerender from the database at build time (D-015), so the build needs a
      # migrated and seeded database: the local Supabase stack (D-043), which applies
      # supabase/migrations on start. Services the site does not use are skipped;
      # Storage stays because the bucket migration needs its schema.
      - run: pnpm exec supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: node scripts/local-supabase-env.mjs >> "$GITHUB_ENV"
      # The committed types must match the migrations, and the schema must lint clean.
      - run: pnpm db:types && git diff --exit-code src/lib/database.types.ts
      - run: pnpm exec supabase db lint --fail-on error
      - run: pnpm db:seed
      - run: pnpm build
      # End-to-end suite against the production build (ARCHITECTURE.md §13).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
