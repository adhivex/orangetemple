name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Pages prerender from the database at build time (D-015), so the build needs a
    # migrated and seeded Postgres. Same major version as local (D-033) and Neon.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orangetemple
          POSTGRES_PASSWORD: orangetemple
          POSTGRES_DB: orangetemple
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orangetemple -d orangetemple"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://orangetemple:orangetemple@localhost:5432/orangetemple
      DIRECT_URL: postgresql://orangetemple:orangetemple@localhost:5432/orangetemple
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_TARGET: development

    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # postinstall runs `prisma generate`; validate needs no database.
      - run: pnpm exec prisma validate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      # End-to-end suite against the production build (ARCHITECTURE.md §13).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
